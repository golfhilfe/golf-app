<style>
/* VOICE everyday: a coach's app clients open daily
   IDEA a shipped iPhone app in the coach's own colours, like a club's yardage book in your pocket
   PICTURE the app itself in a phone frame; inside, the handicap line falling toward the goal
   COLOUR gold #d8a92c fills with near-black #17150f text and logo tile, warm white ground, dark gold #8a6300 for text accents
   TYPE Sora display + Inter text
   LAYOUT laptop: phone frame centred with a short note beside it; phone: the app fills the screen */
:root{color-scheme:light dark;--bg:light-dark(#f3efe5,#0e0d0a);--app:light-dark(#ffffff,#17150f);--surf:light-dark(#f7f3ea,#221f17);--line:light-dark(#e9e2d2,#353024);--ink:light-dark(#17150f,#f4efe4);--mute:light-dark(#6b6352,#aaa290);--green:light-dark(#8a6300,#e6bb45);--gold:#d8a92c;--green2:#17150f;--on:#17150f;--flag:#f4c430;--soft:light-dark(#fbf1d3,#2e2613);--red:light-dark(#c2410c,#fb923c)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Sora,Inter,sans-serif;letter-spacing:-.02em;line-height:1.1;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
.app{position:relative;width:100%;height:100%;border-radius:40px;overflow:hidden;background:var(--app);display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;padding:6px 20px 10px;flex:none}
.brand{display:flex;gap:10px;align-items:center}
.logo{width:36px;height:36px;border-radius:10px;background:var(--green2);display:grid;place-items:center;flex:none}
.logo img{width:20px;height:auto;display:block}
.brand b{font-family:Sora;font-size:20px;display:block;line-height:1.1}
.brand small{color:var(--mute);font-size:12px}
.av{width:36px;height:36px;border-radius:50%;background:var(--soft);color:var(--green);font-weight:600;border:0;display:grid;place-items:center}
.view{flex:1;overflow-y:auto;padding:4px 20px 24px}
.view h2{font-size:26px;margin:6px 0 14px}
.view h3{font-size:16px;margin:22px 0 10px}
.tabs{flex:none;display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);padding:6px 6px 22px;background:var(--app)}
.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mute);padding:6px 0;min-height:44px}
.tabs button[aria-current=page]{color:var(--green);font-weight:600}
.tabs svg{width:24px;height:24px}
.card{background:var(--surf);border-radius:18px;padding:16px;margin-bottom:12px}
.hero{background:var(--gold);color:var(--on);border-radius:22px;padding:18px;position:relative;overflow:hidden}
.hero small{opacity:.8}
.hero h3{margin:4px 0 2px;font-size:20px;color:var(--on)}
.hero .flag{position:absolute;right:14px;top:12px;width:70px;height:90px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.mute{color:var(--mute)}
.sm{font-size:13px}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;background:var(--soft);color:var(--green);font-size:12px;font-weight:600;white-space:nowrap}
.btn{background:var(--gold);color:var(--on);border:0;border-radius:14px;padding:13px 16px;font-weight:600;min-height:46px;width:100%}
.btn.ghost{background:var(--soft);color:var(--green)}
.btn.flagb{background:#17150f;color:#f3d98a}
.btn:disabled{opacity:.45;cursor:default}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surf);border-radius:12px;padding:3px;margin-bottom:16px}
.seg button{border:0;background:none;padding:9px 0;border-radius:10px;font-weight:500;font-size:14px}
.seg button[aria-pressed=true]{background:var(--app);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:14px}
.days button{border:1px solid var(--line);background:var(--app);border-radius:12px;padding:8px 0;display:flex;flex-direction:column;align-items:center;font-size:12px}
.days button b{font-size:16px;font-family:Sora}
.days button[aria-pressed=true]{background:var(--gold);color:var(--on);border-color:var(--gold)}
.days button:disabled{opacity:.35}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.slots button{border:1px solid var(--line);background:var(--app);border-radius:12px;padding:10px 0;font-weight:600;font-variant-numeric:tabular-nums}
.slots button[aria-pressed=true]{border-color:var(--green);background:var(--soft);color:var(--green)}
.slots button:disabled{text-decoration:line-through;opacity:.4}
.opt{display:flex;gap:8px;margin-bottom:14px}
.opt button{flex:1;border:1px solid var(--line);background:var(--app);border-radius:12px;padding:10px 6px;text-align:left}
.opt button[aria-pressed=true]{border-color:var(--green);background:var(--soft)}
.opt b{display:block;font-size:14px}
.opt span{font-size:12px;color:var(--mute)}
.list{display:flex;flex-direction:column;gap:10px}
.drill{display:flex;gap:12px;align-items:flex-start;background:var(--surf);border-radius:16px;padding:14px}
.chk svg path{stroke:var(--on)}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--green);background:none;flex:none;display:grid;place-items:center;padding:0}
.chk[aria-pressed=true]{background:var(--gold)}
.chk svg{width:14px;height:14px;opacity:0}
.chk[aria-pressed=true] svg{opacity:1}
.drill.done b{text-decoration:line-through;color:var(--mute)}
.drill details{margin-top:6px;font-size:13px;color:var(--mute)}
.drill summary{cursor:pointer;color:var(--green);font-weight:500}
.bar{height:8px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);border-radius:9px;transition:width .3s}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surf);border-radius:16px;padding:14px}
.stat b{font-family:Sora;font-size:26px;display:block;line-height:1.1}
.stat .up{color:var(--green);font-size:12px;font-weight:600}
.stat .dn{color:var(--red);font-size:12px;font-weight:600}
.fig{position:relative;height:190px}
.fig svg{position:absolute;inset:0;width:100%;height:100%}
.fig text{font-size:11px;fill:var(--mute);font-family:Inter}
.weeks{display:flex;align-items:flex-end;gap:6px;height:110px}
.weeks div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;font-size:11px;color:var(--mute)}
.weeks i{display:block;width:100%;background:var(--soft);border-radius:6px 6px 3px 3px}
.weeks div:last-child i{background:var(--gold)}
.trip{border-radius:20px;overflow:hidden;background:var(--surf);margin-bottom:14px}
.trip svg{display:block;width:100%;height:130px}
.trip .in{padding:14px 16px 16px}
.trip h3{margin:0 0 4px;font-size:19px}
.it{display:grid;grid-template-columns:52px 1fr;gap:4px 10px;font-size:14px;margin:10px 0}
.it b{color:var(--green);font-variant-numeric:tabular-nums}
.sheet{position:absolute;inset:0;background:rgba(0,0,0,.35);display:flex;align-items:flex-end;z-index:5}
.sheet>div{background:var(--app);width:100%;border-radius:26px 26px 0 0;padding:22px 20px 34px;max-height:88%;overflow-y:auto}
.sheet h2{font-size:22px;margin-bottom:6px}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;gap:12px}
.kv span:last-child{font-weight:600;text-align:right}
.toast{position:absolute;left:20px;right:20px;bottom:96px;background:var(--ink);color:var(--app);padding:12px 16px;border-radius:14px;font-weight:500;z-index:6;transition:opacity .3s}
.field{display:block;margin-bottom:12px;font-size:13px;color:var(--mute)}
.field input,.field select{display:block;width:100%;margin-top:4px;font:16px Inter;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--app);color:var(--ink)}
.client{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.client .av{flex:none}
.client>div{flex:1}
.coachbar{background:#17150f;color:#e6bb45;text-align:center;font-size:12px;font-weight:600;padding:4px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
#avBtn{width:40px;height:40px;background:radial-gradient(circle at 35% 30%,#fff 0 30%,#eef0ee 70%,#d9ddd9 100%);color:#8a6300;font:700 13px Sora,Inter,sans-serif;letter-spacing:.02em;box-shadow:0 2px 6px rgba(0,0,0,.18),inset -2px -3px 5px rgba(0,0,0,.08);position:relative;overflow:hidden}
#avBtn::before{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,rgba(0,0,0,.09) 1.2px,transparent 1.6px) 0 0/6px 6px;opacity:.9}
#avBtn span{position:relative}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;scrollbar-width:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--app);border-radius:99px;padding:8px 12px;font-size:13px;white-space:nowrap;min-height:36px}
.chips button[aria-pressed=true]{background:var(--gold);color:var(--on);border-color:var(--gold)}
.drill.picked{outline:2px solid var(--gold);outline-offset:-2px}
.assignbar{position:sticky;bottom:-24px;background:var(--app);padding:10px 0 12px;margin-top:10px}
.lang{display:flex;background:var(--surf);border-radius:99px;padding:2px}
.lang button{border:0;background:none;padding:6px 9px;border-radius:99px;font-size:12px;font-weight:600;color:var(--mute);min-height:32px}
.lang button[aria-pressed=true]{background:var(--app);color:var(--green);box-shadow:0 1px 2px rgba(0,0,0,.12)}
html,body{height:100%}
body{background:var(--bg)}
.shell{height:100%;display:flex;justify-content:center}
.app{width:100%;max-width:480px;height:100%;border-radius:0;box-shadow:0 0 0 1px var(--line)}
.top{padding-top:calc(12px + env(safe-area-inset-top,0px))}
.tabs{padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
.auth{flex:1;overflow-y:auto;padding:12px 20px 32px}
.auth h2{font-size:28px;margin:10px 0 6px}
.auth .seg{grid-template-columns:1fr 1fr}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--mute);margin:4px 0 14px}
.check input{width:22px;height:22px;flex:none;margin:0;accent-color:var(--green)}
.err{color:var(--red);font-size:14px;margin:0 0 10px;min-height:1px}
.ok{background:var(--soft);color:var(--green);border-radius:14px;padding:14px;font-size:14px;margin-bottom:12px}
.loading{padding:40px 0;text-align:center;color:var(--mute)}
.empty{color:var(--mute);font-size:14px;background:var(--surf);border-radius:16px;padding:16px;margin-bottom:12px}
.daygroup{font:600 13px Inter;color:var(--mute);margin:16px 0 6px}
.contact{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.contact a{font-size:13px;font-weight:600;color:var(--green);background:var(--soft);padding:6px 12px;border-radius:99px;text-decoration:none}
.linkbtn{background:none;border:0;color:var(--green);font-weight:600;padding:6px 0}
.cells{grid-template-columns:repeat(4,1fr)}
.cell{display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 0!important;font-weight:600}
.cell span{font-size:11px;font-weight:500}
.cell.op{border-color:var(--gold)!important;color:var(--green)}
.cell.blk{background:repeating-linear-gradient(135deg,var(--surf) 0 6px,var(--line) 6px 12px)!important;color:var(--mute)}
.cell.bk{background:var(--gold)!important;color:var(--on)!important;opacity:1!important;text-decoration:none!important}
.cell.cl{opacity:.35}
.x{background:none;border:0;color:var(--mute);font-size:13px;padding:4px 8px}
.wa-fab{position:absolute;right:16px;bottom:calc(92px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:8px;background:#25d366;color:#fff;text-decoration:none;font-weight:600;font-size:14px;padding:10px 16px 10px 12px;border-radius:99px;box-shadow:0 6px 16px rgba(0,0,0,.22);z-index:4;font-family:Inter,system-ui,sans-serif}
.wa-fab svg{width:22px;height:22px;flex:none}

.card.mnote{border-left:4px solid #d8a92c}.mnote .new{color:#8a6300}
.tpl{display:block;width:100%;text-align:left;background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font:inherit;font-size:14px;line-height:1.4;color:var(--ink);cursor:pointer}
.tpl:active{background:var(--soft)}
.notearea{display:block;width:100%;box-sizing:border-box;margin-top:6px;font:inherit;font-size:15px;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--surf);color:var(--ink);resize:vertical}
.ctab{width:100%;border-collapse:collapse;font-size:15px}
.ctab th{text-align:left;font-size:12px;font-weight:600;color:var(--mute);padding:0 6px 6px}
.ctab td{padding:5px 6px;border-top:1px solid var(--line)}
.ctab td:first-child{font-weight:600;padding-left:0}
.ctab th:first-child{padding-left:0}
.ctab input{width:76px;box-sizing:border-box;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--app);color:var(--ink);font:inherit;font-size:15px;text-align:right}
.bagchips{flex-wrap:wrap;overflow:visible}
.spin{flex:1;min-width:0;box-sizing:border-box;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--app);color:var(--ink);font:inherit;font-size:16px}
.tabbadge{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;box-sizing:border-box;border-radius:9px;background:#c8372d;color:#fff;font:700 11px/18px Inter,system-ui,sans-serif;text-align:center}
.tabs button{position:relative}
.lapsed{border:1px solid #d8a92c;background:#fbf5e3}
.lapsed .lrow{padding:10px 0;border-top:1px solid var(--line)}
.lapsed .lrow:first-of-type{border-top:0}
.hcpentry{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.dpic{margin:10px 0 4px}.dpic svg{width:100%;height:auto;border-radius:12px;display:block}.dpic figcaption{font-size:13px;color:var(--mute);margin-top:6px;line-height:1.4}

.card,.stat,.drill,.trip{border:1px solid var(--line)}

.btn.flagb{background:#d8a92c;color:#17150f}

.chk svg path{stroke:#fff}

.tabs button[aria-current=page]{color:#17150f}
.tabs{border-top-color:var(--line)}
.weeks i{background:#e2dccb}

.wa-fab svg{width:22px;height:22px;flex:none}
.howl{margin:.4em 0;line-height:1.4}.howl b{display:inline-block;min-width:4.2em}
.badgehead{margin:0 0 4px}.badgeg{margin:12px 0 6px;font-weight:600}.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.badge{background:none;border:0;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:4px;font:inherit;color:inherit;cursor:pointer;min-width:0}.badge span{font-size:11px;line-height:1.2;text-align:center;font-weight:600;overflow-wrap:anywhere}.badge:not(.on) span{color:var(--mute)}.badge i{font-style:normal;font-size:10px;color:var(--mute)}.badgerow{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px}
.mrow{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}.mgroup{padding:12px 0}.mgroup+.mgroup{border-top:2px solid var(--line)}.wk{border:2px solid var(--gold)}

/* phone polish */
.drill .row.between{gap:8px}.drill .row.between>b{min-width:0;overflow-wrap:anywhere}.drill .pill{flex:none;white-space:nowrap}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,a,[data-tab],label{touch-action:manipulation}
.view{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.brand b{white-space:nowrap;font-size:clamp(17px,5.2vw,20px)}
.brand{min-width:0}
input,select,textarea,input[type=number]{font-size:16px!important}
.chk{position:relative}.chk::after{content:'';position:absolute;inset:-9px}
.hero h3{padding-right:58px}
@media (max-width:379px){
 .view{padding-left:16px;padding-right:16px}
 .hero .flag{width:48px;height:64px;right:10px;top:10px}
 .hero h3{font-size:18px;padding-right:44px}
 .wa-fab{font-size:0;gap:0;padding:13px;right:14px}.wa-fab svg{width:26px;height:26px}
 .opt span{font-size:11.5px}
 h2{font-size:24px}
}

/* io: {rows:[{id,kmh,measured_on}], add(kmh)->row, remove(id), done(rows)} */
function speedBox(el,io){
  let rows=[...io.rows].map(r=>({...r,kmh:Number(r.kmh)})).sort((a,b)=>a.measured_on.localeCompare(b.measured_on));
  const spark=()=>{const v=rows.slice(-8).map(r=>r.kmh);if(v.length<2)return'';const W=300,H=56,lo=Math.min(...v)-2,hi=Math.max(...v)+2;
    const pts=v.map((x,i)=>[(i*(W-12)/(v.length-1)+6).toFixed(1),(H-6-(x-lo)/(hi-lo)*(H-12)).toFixed(1)]);
    return`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:56px;display:block;margin:10px 0 4px" aria-hidden="true"><polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="#d8a92c" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i===pts.length-1?5:3}" fill="${i===pts.length-1?'#17150f':'#d8a92c'}"/>`).join('')}</svg>`};
  const draw=()=>{const last=rows.at(-1),first=rows[0];
    el.innerHTML=`<div class="card">${last?`<div class="row between" style="align-items:flex-end"><div><div style="font:700 34px Sora;line-height:1.1;white-space:nowrap">${fmt1(last.kmh)} <span style="font-size:16px;font-weight:600">km/h</span></div><div class="sm mute">≈ ${Math.round(last.kmh/1.609)} mph · ${spDate(last.measured_on)}</div></div>${rows.length>1?`<span class="pill">${st('spSince')(last.kmh-first.kmh,spDate(first.measured_on))}</span>`:''}</div>${spark()}`:`<p class="sm mute" style="margin-top:0">${st('spNone')}</p>`}
    <div class="row" style="gap:8px;margin-top:10px"><input class="spin" type="text" inputmode="decimal" maxlength="5" placeholder="${st('spPh')}" aria-label="${st('spT')} km/h"><button class="btn" style="width:auto;padding:10px 18px;min-height:44px" data-spadd="1">${st('spAdd')}</button></div>
    ${rows.length?`<div style="margin-top:10px">${rows.slice(-5).reverse().map(r=>`<div class="kv"><span>${spDate(r.measured_on)}</span><span>${fmt1(r.kmh)} km/h <button class="x" data-spdel="${r.id}" aria-label="${st('spDel')}">✕</button></span></div>`).join('')}</div>`:''}</div>`};
  draw();
  const add=async()=>{const inp=el.querySelector('.spin');const v=Math.round(parseFloat(String(inp.value).replace(',','.'))*10)/10;
    if(!(v>=40&&v<=260)){toast(st('spBad'));return}
    try{const r=await io.add(v);rows.push({...r,kmh:Number(r.kmh)});rows.sort((a,b)=>a.measured_on.localeCompare(b.measured_on));draw();toast(st('spSaved'));io.done&&io.done(rows)}catch(e){clubErr(e)}};
  el.addEventListener('click',async e=>{if(e.target.closest('[data-spadd]')){e.stopPropagation();add();return}
    const d=e.target.closest('[data-spdel]');if(d){e.stopPropagation();try{await io.remove(d.dataset.spdel);rows=rows.filter(r=>String(r.id)!==d.dataset.spdel);draw();io.done&&io.done(rows)}catch(err){clubErr(err)}}});
  el.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('.spin')){e.preventDefault();add()}});
}

function hcpEntry(el,o){const mName=o.month.toLocaleDateString(loc(),{month:'long'});let edit=!o.has;
  const draw=()=>{el.innerHTML=edit?`<div class="hcpentry"><b class="sm">${ht('enter')(mName)}</b><div class="row" style="gap:8px;margin-top:6px"><input class="spin hcpin" type="text" inputmode="decimal" maxlength="5" placeholder="${ht('ph')}" value="${o.has?fmt1(o.val):''}" aria-label="${ht('enter')(mName)}"><button class="btn" style="width:auto;padding:10px 18px;min-height:44px" data-hsave="1">${ht('save')}</button></div><p class="sm mute" style="margin:6px 0 0">${ht('hint')}</p></div>`
    :`<div class="row between hcpentry"><span class="sm">✓ ${ht('done')(mName,fmt1(o.val))}</span><button class="x" data-hedit="1">${ht('change')}</button></div>`};
  draw();
  const go=async()=>{const v=Math.round(parseFloat(String(el.querySelector('.hcpin').value).replace(',','.'))*10)/10;if(!(v>=-10&&v<=54)){toast(ht('bad'));return}
    try{await o.save(v);toast(ht('saved'))}catch(err){clubErr(err)}};
  el.addEventListener('click',e=>{if(e.target.closest('[data-hedit]')){e.stopPropagation();edit=true;draw();return}if(e.target.closest('[data-hsave]')){e.stopPropagation();go()}});
  el.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('.hcpin')){e.preventDefault();go()}});
}

function clubBox(el,io){
  let bag=io.rows.length?io.rows.map(r=>({club:r.club,carry:r.carry??null,total:r.total??null})):DEF_BAG.map(k=>({club:k,carry:null,total:null}));
  let fresh=!io.rows.length;
  const cell=(r,i,f)=>`<td><input type="number" inputmode="numeric" min="0" max="400" step="1" data-ci="${i}" data-f="${f}" value="${r[f]??''}" placeholder="–" aria-label="${esc(clubName(r.club))} ${ct(f)}"></td>`;
  const draw=()=>{bag.sort((a,b)=>clubOrd(a.club)-clubOrd(b.club));
    el.innerHTML=`<div class="card ctab-wrap">${bag.length?`<table class="ctab"><thead><tr><th>${ct('club')}</th><th>${ct('carry')} (m)</th><th>${ct('total')} (m)</th></tr></thead><tbody>${bag.map((r,i)=>`<tr><td>${esc(clubName(r.club))}</td>${cell(r,i,'carry')}${cell(r,i,'total')}</tr>`).join('')}</tbody></table>`:`<p class="mute sm">${ct('emptyBag')}</p>`}
    <div class="row between" style="margin-top:10px;gap:8px"><span class="sm mute">${ct('inBag')(bag.length+1)}</span><button class="pill" style="border:0;cursor:pointer;white-space:nowrap" data-editbag="1">${ct('editBag')}</button></div>
    <p class="sm mute" style="margin:8px 0 0">${ct('meters')}</p></div>`};
  draw();
  el.addEventListener('change',async e=>{const inp=e.target.closest('[data-ci]');if(!inp)return;const r=bag[+inp.dataset.ci];
    const v=inp.value===''?null:Math.max(0,Math.min(400,Math.round(+inp.value)));r[inp.dataset.f]=v;inp.value=v??'';
    try{if(fresh){await io.saveMany(bag);fresh=false}else await io.save(r);toast(ct('saved'));io.done&&io.done(bag)}catch(err){clubErr(err)}});
  el.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('[data-ci]'))e.target.blur()});
  el.addEventListener('click',e=>{if(e.target.closest('[data-editbag]')){e.stopPropagation();bagSheet()}});
  function bagSheet(){const sel=new Set(bag.map(r=>r.club));
    const s=sheet(`<h2>${ct('editBag')}</h2><p class="sm mute" style="margin-top:0">${ct('bagHint')}</p><div id="bagGroups"></div>
      <p class="sm" id="bagCount" style="font-weight:600"></p><button class="btn" id="bagSave">${ct('saveBag')}</button><button class="btn ghost" data-close style="margin-top:8px">${t('close')}</button>`);
    const drawS=()=>{s.querySelector('#bagGroups').innerHTML=Object.keys(CLUB_GROUPS).map(g=>`<h3 style="margin:14px 0 6px">${CLUB_GROUPS[g][L]}</h3><div class="chips bagchips">${CLUBS.filter(c=>c[3]===g).map(c=>`<button data-bclub="${c[0]}" aria-pressed="${sel.has(c[0])}">${esc(c[L==='de'?1:2])}</button>`).join('')}</div>`).join('');
      const n=sel.size+1;s.querySelector('#bagCount').innerHTML=ct('inBag')(n)+(n>14?` · <span style="color:var(--red)">${ct('over')(n-14)}</span>`:'')};
    drawS();
    s.addEventListener('click',async e=>{e.stopPropagation();const b=e.target.closest('[data-bclub]');if(b){const k=b.dataset.bclub;sel.has(k)?sel.delete(k):sel.add(k);drawS();return}
      if(e.target.closest('[data-close]')||e.target===s){s.remove();return}
      if(e.target.closest('#bagSave')){const btn=s.querySelector('#bagSave');btn.disabled=true;
        const removed=bag.filter(r=>!sel.has(r.club)).map(r=>r.club);const keep=bag.filter(r=>sel.has(r.club));
        const added=[...sel].filter(k=>!bag.some(r=>r.club===k)).map(k=>({club:k,carry:null,total:null}));
        try{if(removed.length&&!fresh)await io.remove(removed);const next=[...keep,...added];if(fresh||added.length)await io.saveMany(fresh?next:added);
          bag=next;fresh=false;draw();s.remove();toast(ct('bagSaved'));io.done&&io.done(bag)}catch(err){btn.disabled=false;clubErr(err)}}});
  }
}

ircle."], ["p", "Gleiches Tempo zurück und vor, wie ein Pendel. Die Schultern machen die Arbeit, nicht die Hände.", "Same tempo back and through, like a pendulum. Your shoulders do the work, not your hands."], ["p", "Vor jedem Putt die gleiche Routine: zweimal Probe, einmal zum Loch schauen, putten.", "Same routine before every putt: two practice strokes, one look at the hole, putt."], ["p", "Lies das Grün von der tiefen Seite. Da siehst du das Gefälle am besten.", "Read the green from the low side. That’s where you see the slope best."], ["p", "Augen direkt über den Ball oder knapp innerhalb. Prüf es mit einem Ball, den du von den Augen fallen lässt.", "Eyes directly over the ball or just inside. Check by dropping a ball from your eyes."], ["p", "Gate-Übung: zwei Tees knapp breiter als der Putterkopf, 20 Putts durch das Tor ohne Berührung.", "Gate drill: two tees just wider than the putter head, 20 putts through the gate without touching."], ["p", "Rückschwung und Durchschwung gleich lang. Das gibt dir ein konstantes Tempo.", "Backswing and follow-through the same length. That gives you a consistent pace."], ["p", "Putt aus 3 Metern so, dass der Ball etwa 40 cm hinter dem Loch liegen bleiben würde.", "Hit 3-metre putts so the ball would stop about 40 cm past the hole."], ["p", "Leiter-Übung: Putts auf 3, 6, 9 und 12 Meter, jeweils möglichst nah ans Ziel.", "Ladder drill: putts to 3, 6, 9 and 12 metres, each as close to the target as possible."], ["p", "Uhr-Übung: 6 Bälle rund ums Loch auf 1 Meter. Erst wenn alle drin sind, geht es auf 1,5 Meter.", "Clock drill: 6 balls around the hole at 1 metre. Only when all are in, move to 1.5 metres."], ["p", "Griffdruck beim Putten ganz leicht, etwa 3 von 10. So bleibt der Schlag weich.", "Light grip pressure when putting, about 3 out of 10. That keeps the stroke smooth."], ["p", "Wähle einen Punkt 30 cm vor dem Ball auf deiner Linie und rolle den Ball darüber.", "Pick a spot 30 cm in front of the ball on your line and roll th ausrichten.", "Set the putter behind the ball first, then align your feet."], ["p", "Schultern und Füße parallel zur Puttlinie. Ein Schläger am Boden hilft beim Kontrollieren.", "Shoulders and feet parallel to the putting line. A club on the ground helps you check."], ["p", "Zähl den Rhythmus beim Putten: „eins“ zurück, „zwei“ durch.", "Count your putting rhythm: “one” back, “two” through."], ["p", "Ein Putt hat nur zwei Teile: Linie und Tempo. Entscheide dich, dann vertrau.", "A putt has two parts: line and pace. Decide, then commit."], ["p", "Wenn du zwischen zwei Linien schwankst, nimm die mit weniger Break und mehr Tempo.", "If you’re torn between two lines, take less break and a bit more pace."], ["p", "Übe 10 Putts aus 2 Metern mit einer Münze hinter dem Loch als Ziel.", "Practise 10 putts from 2 metres aiming at a coin just past the hole."], ["p", "Lass das Handgelenk ruhig. Der Putter bewegt sich durch die Schultern wie ein Pendel.", "Keep your wrists quiet. The putter moves from the shoulders like a pendulum."], ["p", "Bei Grüns mit viel Gefälle: Schau dir das Loch von der Seite an, um die Steigung zu sehen.", "On sloping greens look at the hole from the side to judge the gradient."], ["p", "Putte zu Hause auf dem Teppich 5 Minuten am Tag. Das reicht schon für spürbare Fortschritte.", "Putt on the carpet at home for 5 minutes a day. That’s enough for real progress."], ["p", "Spiel 18 Löcher auf dem Putting-Grün gegen dich selbst. Par ist 36.", "Play 18 holes on the putting green against yourself. Par is 36."], ["p", "Dein Putter-Rhythmus war heute viel gleichmäßiger. Genau so weiter!", "Your putting rhythm was much smoother today. Keep it exactly like that!"], ["p", "Achte auf den Treffpunkt: Ball in der Mitte der Putterfläche treffen.", "Watch your strike: hit the ball in the middle of the putter face."], ["p", "Kreide- oder Schnurlinie auf dem Übungsgrün: Ball startet genau auf der Linie?", "Chalk or string line on the practice green: does the ball start right on it?"], ["p", "Visualisiere den Ball ins Loch rollen, bevor du puttest.", "Visualise the ball rolling into the hole before you putt."], ["p", "Nach einem verschobenen Kurzen: Abhaken, nächster Putt ist neu.", "After missing a short one: let it go, the next putt is a new one."], ["p", "Bei Putts vom Vorgrün: Putter ist oft die sicherste Wahl, wenn das Gras kurz ist.", "From the fringe: the putter is often the safest choice when the grass is short."], ["p", "Probeschwung neben dem Ball mit Blick zum Loch. So stellt sich die Länge von selbst ein.", "Make your practice stroke beside the ball looking at the hole. Distance sets itself."], ["p", "Mach den Rückschwung bei langen Putts länger, nicht schneller.", "On long putts make the backswing longer, not faster."], ["p", "Übe Putts über 1 Meter von allen vier Seiten des Lochs: bergauf, bergab, links, rechts.", "Practise 1-metre putts from all four sides of the hole: uphill, downhill, left, right."], ["p", "Zeit lassen beim Lesen, aber nicht über dem Ball zu lange stehen.", "Take your time reading, but don’t stand over the ball too long."], ["p", "Ein Lauf von 10 eingelochten 1-Meter-Putts ist dein Ziel vor jeder Runde.", "A run of 10 holed 1-metre putts is your target before every round."], ["p", "Weiche Knie, gerader Rücken, Arme hängen locker. So steht man gut zum Putten.", "Soft knees, straight back, arms hanging loosely. That’s a good putting posture."], ["p", "Achte darauf, dass die Putterfläche im Treffmoment genau zum Ziel zeigt. Das ist am wichtigsten.", "Make sure the putter face points exactly at the target at impact. That matters most."], ["p", "Deine Putts waren heute richtig gut dosiert. Weiter so!", "Your pace on the greens was really good today. Keep it up!"], ["p", "Notiere nach jeder Runde deine Putts. Unter 32 ist ein tolles Ziel.", "Write down your putts after every round. Under 32 is a great target."], ["s", "Beim Chippen: Gewicht links, Hände vor dem Ball, und den Schläger die Arbeit machen lassen.", "Chipping: weight on your lead side, hands ahead of the ball, and let the club do the work."], ["s", "Such dir einen Landepunkt etwa 1 Meter aufs Grün und lass den Ball von dort rollen.", "Pick a landing spot about 1 metre onto the green and let the ball roll from there."], ["s", "Wenn möglich rollen statt fliegen: Putter vor Eisen vor Wedge.", "When you can, roll it instead of flying it: putter before iron before wedge."], ["s", "Bei Pitches den Rückschwung kürzen, nicht den Durchschwung bremsen. Immer beschleunigen.", "On pitches shorten the backswing, don’t slow the follow-through. Always accelerate."], ["s", "Übe die Leiter-Übung: Bälle auf 5, 10 und 15 Meter landen lassen, mit demselben Schläger.", "Practise the ladder drill: land balls at 5, 10 and 15 metres with the same club."], ["s", "Das Kurzspiel spart dir die meisten Schläge. Plane mindestens die Hälfte deiner Übungszeit dafür ein.", "Short game saves you the most shots. Spend at least half your practice time on it."], ["s", "Stand beim Chippen schmal und leicht offen. So kommt der Körper leichter durch.", "Narrow and slightly open stance when chipping. Your body turns through more easily."], ["s", "Ball beim Chip leicht rechts der Mitte. Das sorgt für einen sauberen Kontakt.", "Ball slightly back of centre for chips. That gives you clean contact."], ["s", "Handgelenke beim Chip ruhig halten, ähnlich wie beim Putten.", "Keep your wrists quiet when chipping, similar to putting."], ["s", "Chippe mit drei Schlägern zum selben Ziel: 7er-Eisen, 9er-Eisen und Wedge. Schau, wie unterschiedlich der Ball rollt.", "Chip to the same target with a 7 iron, 9 iron and wedge. Watch how differently the ball rolls."], ["s", "Faustregel: mit dem 7er-Eisen fliegt der Ball etwa ein Drittel und rollt zwei Drittel.", "Rule of thumb: with a 7 iron the ball flies about a third and rolls two thirds."], ["s", "Bei Pitches den Körper mitdrehen lassen. Brust zeigt im Finish zum Ziel.", "On pitches let your body turn through. Chest faces the target at the finish."], ["s", "Kein Löffeln! Der Loft des Schlägers bringt den Ball in die Luft, nicht deine Hände.", "No scooping! The loft of the club lifts the ball, not your hands."], ["s", "Übe Pitches auf 20, 30 und 40 Meter mit unterschiedlich langen Rückschwüngen.", "Practise pitches to 20, 30 and 40 metres with different backswing lengths."], ["s", "Uhr-System für Wedges: Rückschwung bis 8, 9 und 10 Uhr ergibt drei feste Längen.", "Clock system for wedges: backswing to 8, 9 and 10 o’clock gives you three set distances."], ["s", "Lege ein Handtuch als Landeziel aufs Grün. 10 Chips, wie viele landen darauf?", "Lay a towel on the green as a landing target. 10 chips, how many land on it?"], ["s", "Aus dem Rough: Schlagfläche etwas öffnen und entschlossener durchschwingen.", "From the rough: open the face a little and swing through more firmly."], ["s", "Bei engen Lagen lieber flach chippen als hoch pitchen. Das ist sicherer.", "From tight lies, chip low rather than pitch high. It’s safer."], ["s", "Hoch über ein Hindernis: Ball weiter vorne, Fläche offen, voller Durchschwung.", "High over an obstacle: ball further forward, face open, full follow-through."], ["s", "Up-and-down-Spiel: 9 Bälle rund ums Grün, wie oft schaffst du es in zwei Schlägen?", "Up-and-down game: 9 balls around the green, how often do you get down in two?"], ["s", "Schau beim Chip auf die Rückseite des Balls, nicht auf das Ziel.", "Look at the back of the ball when chipping, not at the target."], ["s", "Probeschwung genau so lang wie der echte Schwung. Dann einfach wiederholen.", "Practice swing exactly as long as the real one. Then just repeat it."], ["s", "Sauberer Kontakt vor allem: lieber kurzer Chip mit gutem Treffer als langer mit schlechtem.", "Clean contact above all: a short chip struck well beats a long one struck badly."], ["s", "Die Hände führen den Schlägerkopf durch den Ball. Der Schaft lehnt leicht zum Ziel.", "Your hands lead the clubhead through the ball. The shaft leans slightly to the target."], ["s", "Übe mit nur der linken Hand ein paar Chips. Das stabilisiert dein Handgelenk.", "Hit a few chips with only your lead hand. It stabilises your wrist."], ["s", "Leg ein Tee 5 cm hinter den Ball. Wenn du es triffst, kommt der Schläger zu früh runter.", "Put a tee 5 cm behind the ball. If you hit it, the club is coming down too early."], ["s", "Beim Pitchen locker bleiben. Fester Griff tötet das Gefühl.", "Stay relaxed when pitching. A tight grip kills your feel."], ["s", "Lies auch bei Chips das Grün. Der Ball rollt wie ein Putt.", "Read the green for chips too. The ball rolls like a putt."], ["s", "Wähle für jeden Chip zuerst den Landepunkt, dann den Schläger.", "For every chip choose the landing spot first, then the club."], ["s", "Dein Chip-Kontakt war heute richtig sauber. Genau so weiter!", "Your chipping contact was really clean today. Keep it exactly like that!"], ["s", "Kurz vor dem Grün im Zweifel lieber putten. Der schlechteste Putt ist oft besser als der schlechteste Chip.", "Just off the green, putt when in doubt. Your worst putt is often better than your worst chip."], ["s", "Übe Chips aus schlechten Lagen genauso wie aus guten. Auf dem Platz liegst du selten perfekt.", "Practise chips from bad lies as well as good ones. On the course you rarely get a perfect lie."], ["s", "Bergauf-Chip: Schultern parallel zum Hang, Ball fliegt höher und rollt weniger.", "Uphill chip: shoulders parallel to the slope, the ball flies higher and rolls less."], ["s", "Bergab-Chip: Ball weiter rechts, Gewicht deutlich links, flacher Schwung.", "Downhill chip: ball further back, weight clearly forward, shallow swing."], ["s", "Bei langen Pitches mehr Körper, weniger Arme.", "On longer pitches use more body, less arms."], ["s", "Wedge-Ziel diese Woche: 10 Bälle aus 30 Metern, 5 davon innerhalb von 3 Metern ums Loch.", "Wedge goal this week: 10 balls from 30 metres, 5 of them within 3 metres of the hole."], ["s", "Kurzspiel ist Gefühl. Spiel viele verschiedene Schläge, nicht immer denselben.", "Short game is feel. Play lots of different shots, not always the same one."], ["s", "Bei Wind kurz ums Grün: flacher Chip statt hoher Pitch.", "In wind around the green: low chip rather than high pitch."], ["s", "Halte das Finish beim Chip kurz und tief, die Schlagfläche zeigt nach oben.", "Keep your chipping finish short and low, with the face pointing up."], ["s", "Fokus auf einen gleichmäßigen Rhythmus. Kurzer Schwung heißt nicht hektischer Schwung.", "Focus on a steady rhythm. A short swing doesn’t mean a rushed swing."], ["s", "Spiel eine Runde, bei der du jedes verfehlte Grün mit Chip und Putt rettest. Zähl die Erfolge.", "Play a round trying to get up and down from every missed green. Count your successes."], ["s", "Probier den Bump-and-Run mit dem 8er-Eisen. Auf harten Grüns oft die beste Wahl.", "Try the bump and run with an 8 iron. Often the best choice on firm greens."], ["s", "Der Schlägerkopf darf den Boden leicht streifen. Keine Angst vor Rasenkontakt.", "The clubhead can brush the ground lightly. Don’t be afraid of turf contact."], ["s", "Wenn der Ball zu weit rollt: weniger Tempo, nicht kürzerer Durchschwung.", "If the ball rolls too far: less speed, not a shorter follow-through."], ["s", "Merk dir deine Lieblingsdistanz mit dem Wedge. Auf die spielst du bei Layups hin.", "Remember your favourite wedge distance. Lay up to it on longer holes."], ["s", "Übe 15 Minuten Kurzspiel vor jeder Range-Session. Danach erst die langen Schläger.", "Practise 15 minutes of short game before every range session. Only then the long clubs."], ["s", "Schlechte Lage im Rough: lieber sicher aufs Grün als zu riskant an die Fahne.", "Bad lie in the rough: safely onto the green beats risky at the flag."], ["s", "Bleib beim Chip in der Bewegung tief, kein Aufrichten vor dem Treffmoment.", "Stay down through the chip, don’t stand up before impact."], ["s", "Visualisiere Flug und Rollweg, bevor du chipst. Dann schlag genau diesen Ball.", "Visualise the flight and roll before you chip. Then hit exactly that shot."], ["s", "Dein Gefühl für Längen rund ums Grün wird immer besser. Toll gemacht!", "Your feel for distance around the greens keeps improving. Well done!"], ["b", "Im Bunker: Schlagfläche offen, Sand ca. 3 cm hinter dem Ball treffen und voll durchschwingen.", "In the bunker: open the face, hit the sand about 3 cm behind the ball and swing all the way through."], ["b", "Stand im Bunker etwas breiter und die Füße in den Sand drehen. Das gibt dir Halt.", "Widen your stance in the bunker and twist your feet into the sand. That gives you stability."], ["b", "Zeichne eine Linie in den Sand und übe, sie jedes Mal gleich zu treffen. So lernst du den Eintrittspunkt.", "Draw a line in the sand and practise hitting it every time. That teaches you your entry point."], ["b", "Keine Angst vor dem Bunker: Mit Tempo durch den Sand fliegt der Ball fast von selbst raus.", "Don’t fear the bunker: with speed through the sand the ball almost pops out on its own."], ["b", "Erst die Schlagfläche öffnen, dann greifen. Nicht umgekehrt.", "Open the clubface first, then take your grip. Not the other way round."], ["b", "Ball im Bunker leicht links der Mitte, Gewicht eher auf dem vorderen Fuß.", "Ball slightly forward in the bunker, weight more on your lead foot."], ["b", "Im Bunker den Schläger nicht vor dem Schlag im Sand aufsetzen. Das ist ein Strafschlag.", "Don’t ground the club in the bunker before the shot. That’s a penalty."], ["b", "Stell dir vor, du schlägst eine dünne Scheibe Sand samt Ball aufs Grün.", "Imagine you’re splashing a thin slice of sand with the ball onto the green."], ["b", "Durchschwingen bis zum vollen Finish, auch bei kurzen Bunkerschlägen. Nie abbremsen.", "Swing through to a full finish, even on short bunker shots. Never decelerate."], ["b", "Länge im Bunker steuerst du über die Schwunglänge, nicht über die Kraft.", "Control distance in the bunker with swing length, not force."], ["b", "Dollar-Schein-Übung: Stell dir eine Banknote unter dem Ball vor und schlag sie komplett aus dem Sand.", "Banknote drill: imagine a note under the ball and splash the whole note out of the sand."], ["b", "Bei Spiegeleiern: Schlagfläche square oder leicht geschlossen, steiler rein und mehr Kraft.", "For a fried-egg lie: face square or slightly closed, steeper in and more power."], ["b", "Nasser, fester Sand: Schlagfläche weniger öffnen, Ball rollt mehr.", "Wet, firm sand: open the face less, the ball will roll more."], ["b", "Weicher, tiefer Sand: Fläche weit öffnen und mit viel Tempo durch.", "Soft, deep sand: open the face wide and swing through with lots of speed."], ["b", "Hohe Bunkerkante: Ball weiter vorne, Fläche weiter offen, hoher Finish.", "High bunker lip: ball further forward, face more open, high finish."], ["b", "Fairwaybunker: Ball zuerst treffen, Füße nur leicht eingraben, einen Schläger mehr nehmen.", "Fairway bunker: hit the ball first, dig your feet in only slightly, take one more club."], ["b", "Fairwaybunker: Bei hoher Kante immer genug Loft wählen. Erst raus, dann Länge.", "Fairway bunker: with a high lip always take enough loft. Out first, distance second."], ["b", "Übe 10 Bunkerschläge hintereinander. Ziel: alle auf dem Grün.", "Practise 10 bunker shots in a row. Goal: all of them on the green."], ["b", "Lass die Hände locker und den Schlägerkopf durch den Sand gleiten.", "Keep your hands soft and let the clubhead glide through the sand."], ["b", "Der Bounce des Sandwedges ist dein Freund. Mit offener Fläche nutzt du ihn optimal.", "The bounce of your sand wedge is your friend. An open face uses it best."], ["b", "Schultern parallel zum Gelände, auch im Bunker. Bei Hanglage anpassen.", "Shoulders parallel to the ground, in the bunker too. Adjust on slopes."], ["b", "Bergauf im Bunker: mehr Loft, der Ball fliegt höher und kürzer.", "Uphill in the bunker: more loft, the ball flies higher and shorter."], ["b", "Bergab im Bunker: Gewicht links, Schlägerkopf dem Hang folgen lassen.", "Downhill in the bunker: weight forward, let the clubhead follow the slope."], ["b", "Dein Bunkerspiel war heute viel sicherer. Super gemacht!", "Your bunker play was much more confident today. Well done!"], ["b", "Der Schwung im Bunker ist etwa doppelt so lang wie bei einem Chip auf dieselbe Distanz.", "Your bunker swing is about twice as long as a chip to the same distance."], ["b", "Rechen nach dem Schlag nicht vergessen. Guter Golf-Stil gehört dazu.", "Don’t forget to rake after your shot. Good etiquette is part of the game."], ["b", "Drehe den Körper im Bunker voll durch. Brust im Finish zum Ziel.", "Turn your body fully through in the bunker. Chest to the target at the finish."], ["b", "Ziel aus dem Grünbunker: zuerst raus und aufs Grün. Fahne angreifen kommt später.", "Goal from a greenside bunker: out and onto the green first. Attacking the flag comes later."], ["b", "Kurze Bunkerschläge brauchen genauso viel Tempo, nur mehr Sand.", "Short bunker shots need the same speed, just more sand."], ["b", "Übe Bunkerschläge mit nur der rechten Hand. Das zeigt dir, wie der Schlägerkopf durch den Sand gleitet.", "Practise bunker shots with only your trail hand. It shows how the clubhead slides through the sand."], ["b", "Zwei Tees in den Sand, Abstand 10 cm: Schläger tritt beim ersten ein und verlässt beim zweiten.", "Two tees in the sand 10 cm apart: the club enters at the first and exits at the second."], ["b", "Schau im Bunker auf den Punkt hinter dem Ball, nicht auf den Ball selbst.", "In the bunker look at the spot behind the ball, not at the ball itself."], ["b", "Etwas tiefer in die Knie gehen, damit der Schläger unter den Ball kommt.", "Flex your knees a little more so the club gets under the ball."], ["b", "Bei langen Bunkerschlägen: weniger offen, weniger Sand, mehr Länge.", "For long bunker shots: less open, less sand, more distance."], ["b", "Probier aus dem Bunker auch mal das Gap Wedge. Der Ball rollt weiter.", "Try the gap wedge from the bunker too. The ball rolls further."], ["b", "Bleib nach dem Schlag im Finish. Wer früh aufschaut, trifft oft zu dünn.", "Hold your finish after the shot. Looking up early often means hitting it thin."], ["b", "Halte den Rhythmus im Bunker ruhig. Langsam zurück, kräftig durch.", "Keep your bunker rhythm calm. Slow back, strong through."], ["b", "Für mehr Spin: weniger Sand nehmen und schneller schwingen. Für weniger Spin: mehr Sand.", "For more spin: take less sand and swing faster. For less spin: more sand."], ["b", "Ein Bunker ist kein Drama. Mit der richtigen Technik ist er oft leichter als dichtes Rough.", "A bunker is no drama. With the right technique it’s often easier than thick rough."], ["b", "Übe Bunkerschläge auf 3 verschiedene Ziele: kurz, mittel, lang.", "Practise bunker shots to 3 different targets: short, medium, long."], ["b", "Prüfe vorher die Sandbeschaffenheit mit den Füßen beim Hineinstellen.", "Feel the sand with your feet as you take your stance."], ["b", "Wenn du den Ball direkt triffst, warst du zu weit vorne mit dem Eintrittspunkt.", "If you hit the ball directly, your entry point was too far forward."], ["b", "Wenn der Ball im Bunker bleibt, war meist zu wenig Tempo im Durchschwung.", "If the ball stays in the bunker, there was usually too little speed through."], ["b", "Arme locker, Körper dreht. Im Bunker schwingst du ganz normal, nur mit offener Fläche.", "Arms loose, body turns. In the bunker it’s a normal swing, just with an open face."], ["b", "Plane 10 Minuten Bunkertraining in jede Übungseinheit ein. Das zahlt sich aus.", "Plan 10 minutes of bunker practice into every session. It pays off."], ["b", "Vor einem Bunker: Spiel lieber auf die sichere Seite des Grüns.", "In front of a bunker: play to the safe side of the green."], ["b", "Spiel aus dem Bunker mit dem Ziel, den nächsten Putt kurz zu haben, nicht unbedingt den perfekten Schlag.", "Play from the bunker aiming for a short next putt, not necessarily the perfect shot."], ["b", "Dein Eintrittspunkt im Sand war heute sehr konstant. Genau daran arbeiten wir weiter.", "Your entry point in the sand was very consistent today. That’s what we keep working on."], ["b", "Bei Bunkern mit wenig Sand: Schlagfläche nur leicht öffnen, sonst springt der Schläger ab.", "In bunkers with little sand: open the face only slightly, otherwise the club bounces off."], ["b", "Mehr Vertrauen in den Bunkerschlag! Du kannst es, das hast du heute gezeigt.", "More confidence in your bunker shot! You can do it, you showed that today."], ["i", "Denk an das, was wir geübt haben: erst den Ball, dann den Boden. Das Divot liegt vor dem Ball.", "Remember what we practised: ball first, then turf. The divot is in front of the ball."], ["i", "Dein Griff war heute viel besser. Prüf ihn vor jedem Schlag, bis er automatisch passt.", "Your grip was much better today. Check it before every shot until it’s automatic."], ["i", "Leg beim Üben immer einen Schläger als Ausrichtungshilfe auf den Boden.", "Always lay a club on the ground as an alignment aid when you practise."], ["i", "Mehr Drehung, weniger Arme. Lass den Oberkörper den Schwung führen.", "More turn, less arms. Let your upper body lead the swing."], ["i", "Halte die Balance im Finish, bis der Ball landet. Das zeigt dir, ob der Schwung im Gleichgewicht war.", "Hold your finish until the ball lands. It shows you whether your swing was in balance."], ["i", "Übe mit halben Schwüngen: sauberer Treffpunkt zuerst, Länge kommt später.", "Practise with half swings: clean contact first, distance comes later."], ["i", "Ballposition prüfen: kurze Eisen in der Mitte, längere Eisen etwas weiter vorne.", "Check your ball position: short irons in the middle, longer irons a little further forward."], ["i", "Hände im Treffmoment vor dem Ball. So komprimierst du den Ball richtig.", "Hands ahead of the ball at impact. That’s how you compress it properly."], ["i", "Im Rückschwung den Schläger auf Hüfthöhe parallel zur Ziellinie bringen.", "In the backswing get the club parallel to the target line at hip height."], ["i", "Gewicht im Durchschwung auf den vorderen Fuß verlagern. Die rechte Ferse hebt sich.", "Shift your weight to your lead foot on the downswing. Your trail heel comes up."], ["i", "Rücken gerade, aus der Hüfte nach vorne neigen, Knie leicht gebeugt.", "Straight back, tilt forward from the hips, knees slightly flexed."], ["i", "Der Abstand zum Ball: Arme hängen locker senkrecht unter den Schultern.", "Distance from the ball: arms hang loosely straight down from your shoulders."], ["i", "Griffdruck mittel, etwa 5 von 10. Zu fest bremst den Schwung.", "Medium grip pressure, about 5 out of 10. Too tight slows the swing."], ["i", "Linker Arm im Rückschwung gestreckt, aber nicht verkrampft.", "Lead arm extended in the backswing, but not stiff."], ["i", "Kopf bleibt hinter dem Ball, bis der Ball weg ist.", "Keep your head behind the ball until it’s gone."], ["i", "Starte den Abschwung mit der Hüfte, nicht mit den Armen.", "Start the downswing with your hips, not your arms."], ["i", "Handtuch unter beide Achseln: 10 halbe Schwünge, ohne dass es herunterfällt.", "Towel under both armpits: 10 half swings without dropping it."], ["i", "Schwungbahn mit Alignment-Stick üben: Stick schräg in den Boden, Schläger darunter durchschwingen.", "Practise swing path with an alignment stick: stick angled in the ground, swing the club underneath it."], ["i", "Wenn der Ball nach rechts kurvt: Prüf zuerst Griff und Schlagfläche, nicht gleich die Schwungbahn.", "If the ball curves right: check grip and face first, not the swing path straight away."], ["i", "Gegen Toppen: im Schwung tief bleiben, die Brust bleibt über dem Ball.", "Against topping: stay down through the swing, chest stays over the ball."], ["i", "Gegen fette Schläge: mehr Gewicht nach vorne und Hände vor dem Ball.", "Against fat shots: more weight forward and hands ahead of the ball."], ["i", "Mach das Tempo zum Ziel: drei Sekunden zurück, eine Sekunde durch.", "Make tempo the goal: three counts back, one count through."], ["i", "Übe Schläge mit 50, 75 und 100 Prozent Schwung. So bekommst du Kontrolle über die Länge.", "Practise shots at 50, 75 and 100 percent swing. That gives you control over distance."], ["i", "Ziele auf der Range immer auf ein konkretes Ziel. Nie einfach drauflos schlagen.", "Always aim at a specific target on the range. Never just hit balls."], ["i", "Wechsle auf der Range oft den Schläger und das Ziel, wie auf dem Platz.", "On the range change club and target often, just like on the course."], ["i", "Rückschwung ruhig und vollständig. Erst wenn er fertig ist, beginnt der Abschwung.", "Calm, complete backswing. The downswing only starts when it’s finished."], ["i", "Dein Treffmoment war heute richtig satt. Genau dieses Gefühl suchen wir.", "Your strike was really solid today. That’s exactly the feeling we’re after."], ["i", "Spray auf die Schlagfläche zeigt dir den Treffpunkt. Ziel: Mitte.", "Foot spray on the clubface shows your strike point. Target: the centre."], ["i", "Beim Hanglage-Schlag Schultern parallel zum Hang und Ball etwas weiter Richtung höheren Fuß.", "On sloping lies keep your shoulders parallel to the slope and the ball a bit toward the higher foot."], ["i", "Ball über den Füßen fliegt nach links. Ziel etwas rechts wählen.", "Ball above your feet flies left. Aim a little right."], ["i", "Ball unter den Füßen fliegt nach rechts. Tiefer in die Knie und etwas links zielen.", "Ball below your feet flies right. Flex your knees more and aim a little left."], ["i", "Aus dem Rough: steiler ausholen, Ball etwas weiter rechts, kurzer Finish.", "From the rough: steeper backswing, ball slightly back, shorter finish."], ["i", "Für einen flachen Schlag unter Ästen: Ball weiter rechts, kurzer Schwung, niedriges Finish.", "For a low shot under branches: ball further back, short swing, low finish."], ["i", "Der Schläger macht die Arbeit. Vertrau dem Loft und schwing einfach durch.", "The club does the work. Trust the loft and swing through."], ["i", "Schwunggedanke für diese Woche: nur einer. Mehr verwirrt auf dem Platz.", "Swing thought for this week: only one. More will confuse you on the course."], ["i", "Nimm dir zu Hause 5 Minuten für Probeschwünge in Zeitlupe. Das schult die Bewegung.", "Take 5 minutes at home for slow-motion practice swings. It trains the movement."], ["i", "Filme deinen Schwung von hinten und von vorne. Wir schauen es uns zusammen an.", "Film your swing from behind and from the front. We’ll look at it together."], ["i", "Pause beim Üben: nach 20 Bällen kurz durchatmen und neu ausrichten.", "Take breaks when practising: after 20 balls breathe and realign."], ["i", "Dein Finish sieht inzwischen richtig gut aus. Bauch zum Ziel, Gewicht links.", "Your finish looks really good now. Belt buckle to the target, weight forward."], ["i", "Beim 7er-Eisen merken: Ball etwas links der Mitte, ruhiger voller Schwung.", "With the 7 iron remember: ball just forward of centre, calm full swing."], ["i", "Lange Eisen nicht härter schlagen. Der Schläger ist länger, das Tempo bleibt gleich.", "Don’t hit long irons harder. The club is longer, the tempo stays the same."], ["i", "Wenn ein langes Eisen nicht klappt, nimm ein Hybrid. Das ist keine Schande.", "If a long iron isn’t working, use a hybrid. There’s no shame in it."], ["i", "Wärm dich vor dem Üben mit kurzen Schlägen auf. Danach Schritt für Schritt länger.", "Warm up with short clubs before practising. Then gradually go longer."], ["i", "Prüf deine Ausrichtung regelmäßig. Die meisten Fehlschläge beginnen beim Ansprechen.", "Check your alignment regularly. Most bad shots start at address."], ["i", "Eine gute Ansprechposition ist die halbe Miete. Nimm dir dafür Zeit.", "A good set-up is half the battle. Take your time with it."], ["i", "Übe die Übergangsbewegung langsam: Pause oben, dann Hüfte starten.", "Practise the transition slowly: pause at the top, then start with the hips."], ["i", "Weniger ist mehr: Ein ruhiger 80-Prozent-Schwung trifft öfter die Mitte.", "Less is more: a calm 80 percent swing finds the centre more often."], ["i", "Achte auf die Schlagfläche im Rückschwung: auf Hüfthöhe zeigt die Spitze nach oben.", "Watch the face in the backswing: at hip height the toe points up."], ["i", "Die Verbesserung bei deinen Eisen ist deutlich. Die Bälle fliegen jetzt viel gerader.", "The improvement in your irons is clear. The ball flies much straighter now."], ["i", "Bring deinen Schwung auf den Platz: Spiel die nächste Runde mit nur einem Schwunggedanken.", "Take your swing to the course: play your next round with just one swing thought."], ["d", "Beim Driver: Ball höher aufteen und weiter vorne, auf Höhe der linken Ferse.", "Driver: tee the ball higher and further forward, in line with your lead heel."], ["d", "Nicht draufhauen, sondern durchschwingen. Rhythmus bringt mehr Länge als Kraft.", "Don’t hit at it, swing through it. Rhythm gives you more distance than power."], ["d", "Für den Driver: Schwung leicht nach oben treffen. Schultern im Stand etwas geneigt.", "With the driver, hit slightly up on the ball. Tilt your shoulders a little at address."], ["d", "Ein Fairway-Treffer mit 200 Metern ist besser als 230 Meter im Rough. Sicherheit zuerst.", "A fairway hit at 200 metres beats 230 metres in the rough. Safety first."], ["d", "Mach 10 Schwünge mit 70 Prozent Tempo. Du wirst sehen, wie viel gerader der Ball fliegt.", "Make 10 swings at 70 percent speed. You’ll see how much straighter the ball flies."], ["d", "Halber Ball über der Schlagfläche, wenn der Driver am Boden aufsetzt. Das ist die richtige Tee-Höhe.", "Half the ball above the clubface when the driver rests on the ground. That’s the right tee height."], ["d", "Stand beim Driver etwas breiter als schulterbreit. Das gibt Stabilität.", "Stance with the driver a bit wider than shoulder width. That gives stability."], ["d", "Voller Rückschwung mit Schulterdrehung, der Rücken zeigt zum Ziel.", "Full backswing with shoulder turn, your back faces the target."], ["d", "Gewicht im Rückschwung auf den hinteren Fuß, dann kraftvoll nach vorne.", "Weight to your trail foot in the backswing, then powerfully forward."], ["d", "Kopf bleibt hinter dem Ball, auch im Treffmoment.", "Keep your head behind the ball, even at impact."], ["d", "Gegen den Slice: Griff etwas stärker und von innen an den Ball kommen.", "Against the slice: slightly stronger grip and approach the ball from the inside."], ["d", "Gegen den Hook: Griff etwas neutraler und die Hände nicht zu früh drehen.", "Against the hook: slightly more neutral grip and don’t rotate your hands too early."], ["d", "Wähle auf dem Abschlag immer ein kleines Ziel, z. B. einen Baum am Horizont.", "Always pick a small target on the tee, like a tree on the horizon."], ["d", "Tee auf der Seite auf, auf der die Gefahr liegt. Dann spielst du von ihr weg.", "Tee up on the side where the trouble is. Then you play away from it."], ["d", "Bei engen Löchern ruhig Holz 3 oder Hybrid statt Driver nehmen.", "On tight holes feel free to use a 3 wood or hybrid instead of the driver."], ["d", "Üb das Tempo: zähl „eins“ im Rückschwung, „zwei“ im Durchschwung.", "Practise tempo: count “one” in the backswing, “two” in the downswing."], ["d", "Schlägerkopfgeschwindigkeit steigerst du mit Technik und Beweglichkeit, nicht mit den Armen.", "You increase club head speed with technique and mobility, not with your arms."], ["d", "Speed-Training: 5 Schwünge so schnell wie möglich ohne Ball, dann 5 normale mit Ball.", "Speed training: 5 swings as fast as possible without a ball, then 5 normal ones with a ball."], ["d", "Dein Driver war heute richtig stark. Lange und gerade, so soll es sein!", "Your driver was really strong today. Long and straight, that’s how it should be!"], ["d", "Ziel für die nächste Runde: 8 von 14 Fairways treffen.", "Goal for your next round: hit 8 of 14 fairways."], ["d", "Lockere Arme beim Driver. Verkrampfte Arme kosten Länge.", "Loose arms with the driver. Tense arms cost distance."], ["d", "Finish vollständig: Gewicht links, Bauch zum Ziel, Schläger hinter dem Kopf.", "Complete finish: weight forward, belt buckle to target, club behind your head."], ["d", "Wenn der Driver nicht läuft: Tee etwas tiefer und mit 80 Prozent schwingen.", "When the driver isn’t working: tee it a little lower and swing at 80 percent."], ["d", "Sweet Spot treffen bringt mehr als Kraft. Prüf es mit Spray auf der Schlagfläche.", "Hitting the sweet spot beats power. Check with spray on the clubface."], ["d", "Beim Driver den Ball in der Ansprechposition etwas weiter weg als beim Eisen.", "With the driver stand a bit further from the ball than with an iron."], ["d", "Breite im Rückschwung: Hände weit vom Körper wegführen, das bringt Radius und Länge.", "Width in the backswing: take your hands away from your body for radius and distance."], ["d", "Mit Gegenwind: Ball etwas tiefer aufteen und ruhig schwingen.", "Into the wind: tee it a little lower and swing smoothly."], ["d", "Mit Rückenwind: Ball höher aufteen und hoch starten lassen.", "Downwind: tee it higher and launch it high."], ["d", "Übe auf der Range Fairways: zwei Ziele im Abstand von 30 Metern, der Ball muss dazwischen landen.", "Practise fairways on the range: two targets 30 metres apart, the ball must land in between."], ["d", "Die Pre-Shot-Routine beim Abschlag ist immer gleich: hinter dem Ball, Ziel wählen, ansprechen, los.", "Your pre-shot routine on the tee is always the same: behind the ball, pick a target, set up, go."], ["d", "Atme vor dem Abschlag einmal tief aus. Das löst Spannung.", "Breathe out deeply before teeing off. It releases tension."], ["d", "Hüfte führt den Abschwung. Die Arme folgen.", "Your hips lead the downswing. The arms follow."], ["d", "Rechte Schulter im Abschwung nach unten, nicht nach vorne.", "Trail shoulder moves down in the downswing, not out."], ["d", "Schau dir deine Schlägerkopfgeschwindigkeit regelmäßig an. Trag sie in der App ein.", "Check your club head speed regularly. Log it in the app."], ["d", "Für mehr Länge: hoher Abflugwinkel, wenig Spin. Daran arbeiten wir.", "For more distance: high launch, low spin. That’s what we’re working on."], ["d", "Probier einen Schwung mit geschlossenen Füßen. Das zwingt dich zu Balance und Rhythmus.", "Try swinging with your feet together. It forces balance and rhythm."], ["d", "Dein Ballflug mit dem Driver ist viel stabiler geworden. Toller Fortschritt!", "Your driver ball flight has become much more stable. Great progress!"], ["d", "Beim ersten Abschlag der Runde: sicherer Schlag, nicht der längste.", "On the first tee: a safe shot, not the longest."], ["d", "Ein verunglückter Drive ist kein Drama. Mit dem zweiten Schlag rettest du viel.", "A bad drive is no disaster. You can save a lot with your second shot."], ["d", "Spiel bei Problemen auf der Runde den Ball vom Tee mit dem Schläger, dem du am meisten vertraust.", "When struggling on the course, tee off with the club you trust most."], ["d", "Nutze die ganze Abschlagbox. Ein guter, ebener Stand ist wichtig.", "Use the whole teeing ground. A good, level stance matters."], ["d", "Übe 10 Drives mit einem Ziel vor Augen, nicht 50 ohne Plan.", "Hit 10 drives with a clear target, not 50 without a plan."], ["d", "Fitness hilft deinem Driver: Rumpfdrehung und Hüftbeweglichkeit regelmäßig trainieren.", "Fitness helps your driver: train core rotation and hip mobility regularly."], ["d", "Lass den Schläger im Durchschwung frei laufen. Nicht festhalten.", "Let the club release freely through impact. Don’t hold on."], ["d", "Wenn der Ball zu hoch steigt: Tee tiefer und Ball etwas weiter rechts.", "If the ball climbs too high: lower tee and ball slightly further back."], ["d", "Wenn der Ball zu flach fliegt: Tee höher und mehr nach oben schwingen.", "If the ball flies too low: higher tee and swing more upwards."], ["d", "Driver ist ein Schläger wie jeder andere. Ruhig bleiben, gleicher Rhythmus.", "The driver is a club like any other. Stay calm, same rhythm."], ["d", "Die rechte Ferse bleibt im Abschwung kurz am Boden, dann dreht sie sich mit.", "Your trail heel stays down briefly in the downswing, then turns through."], ["d", "Spiele bei Löchern mit Wasser lieber auf die sichere Seite, auch wenn der Weg länger ist.", "On holes with water play to the safe side, even if it’s longer."], ["d", "Beim nächsten Training: 20 Drives, und zähl, wie viele im Fairway gelandet wären.", "Next practice: 20 drives, and count how many would have found the fairway."], ["c", "Auf dem Platz: Spiel zur Mitte des Grüns, nicht direkt zur Fahne.", "On the course: play to the middle of the green, not straight at the flag."], ["c", "Nach einem schlechten Schlag: tief durchatmen, abhaken, nächster Schlag. Nur der zählt.", "After a bad shot: deep breath, let it go, next shot. That’s the only one that counts."], ["c", "Plane jedes Loch rückwärts: Von wo willst du ans Grün spielen?", "Plan every hole backwards: where do you want to play into the green from?"], ["c", "Im Zweifel einen Schläger mehr nehmen. Die meisten Bälle landen zu kurz.", "When in doubt, take one more club. Most shots finish short."], ["c", "Bleib in deiner Routine, auch wenn es mal nicht läuft. Sie gibt dir Ruhe.", "Stick to your routine, even when things aren’t going well. It keeps you calm."], ["c", "Spiel deine nächste Runde mit nur einem Ziel: keine Dreiputts. Sonst nichts zählen.", "Play your next round with one goal only: no three-putts. Don’t count anything else."], ["c", "Schreib nach der Runde auf: Fairways, Grüns, Putts. Dann wissen wir, woran wir arbeiten.", "After your round write down fairways, greens and putts. Then we know what to work on."], ["c", "Denk nicht an den Score, sondern nur an den nächsten Schlag.", "Don’t think about your score, only about the next shot."], ["c", "Aus Problemen erst sicher raus. Der Heldenschlag kostet meist mehr, als er bringt.", "Get out of trouble safely first. The hero shot usually costs more than it gains."], ["c", "Spiel bei Wind einen Schläger mehr und schwing ruhiger.", "In wind take one more club and swing more smoothly."], ["c", "Kenne deine Schlägerweiten. Trag sie in der App ein, dann wählst du auf dem Platz sicherer.", "Know your club distances. Log them in the app and you’ll choose more confidently on the course."], ["c", "Ein Bogey ist kein Drama. Doppel-Bogeys vermeiden ist das eigentliche Ziel.", "A bogey is no drama. Avoiding double bogeys is the real goal."], ["c", "Vor dem Schlag: Entscheide dich klar für Schläger und Ziel. Zweifel kostet Schläge.", "Before each shot: commit clearly to club and target. Doubt costs strokes."], ["c", "Zwischen den Schlägen entspannen. Konzentrieren musst du dich nur für etwa 30 Sekunden.", "Relax between shots. You only need to focus for about 30 seconds."], ["c", "Lächle nach einem guten Schlag und merk dir das Gefühl. Positives speichert sich besser.", "Smile after a good shot and remember the feeling. Positive moments stick better."], ["c", "Spiel die Par-5-Löcher in drei klugen Schlägen statt in zwei riskanten.", "Play par 5s in three smart shots instead of two risky ones."], ["c", "Layup auf deine Lieblingsdistanz, nicht so nah wie möglich ans Grün.", "Lay up to your favourite distance, not as close to the green as possible."], ["c", "Vor Wasser oder Aus immer erst fragen: Was ist der sichere Weg?", "Before water or out of bounds always ask: what’s the safe route?"], ["c", "Wärm dich vor der Runde mindestens 15 Minuten auf. Die ersten Löcher werden besser.", "Warm up for at least 15 minutes before your round. The first holes will go better."], ["c", "Iss und trink während der Runde. Ab Loch 10 entscheidet oft die Energie.", "Eat and drink during the round. From hole 10, energy often decides."], ["c", "Teile die Runde in sechs Abschnitte zu je drei Löchern. Jeder Abschnitt ist ein neues Spiel.", "Split the round into six sections of three holes. Each section is a new game."], ["c", "Vertrau auf dem Platz deinem Schwung. Technik üben wir auf der Range.", "Trust your swing on the course. We work on technique on the range."], ["c", "Auf dem Platz nur ein Schwunggedanke, am besten etwas Einfaches wie „ruhig durch“.", "Only one swing thought on the course, ideally something simple like “smooth through”."], ["c", "Lass dich nicht von Mitspielern hetzen. Dein Rhythmus gehört dir.", "Don’t let playing partners rush you. Your rhythm is your own."], ["c", "Nervös auf dem ersten Abschlag? Ganz normal. Atme aus und nimm einen Schläger, dem du vertraust.", "Nervous on the first tee? Completely normal. Breathe out and take a club you trust."], ["c", "Ärger nach einem Fehler darf bis zum nächsten Ball dauern. Dann ist er vorbei.", "Anger after a mistake can last until you reach your ball. Then it’s over."], ["c", "Fahne hinten auf dem Grün: Spiel lieber zu kurz als zu lang.", "Flag at the back of the green: rather short than long."], ["c", "Fahne nah am Bunker: Ziel auf die sichere Seite des Grüns.", "Flag close to a bunker: aim at the safe side of the green."], ["c", "Bei Schräglage auf dem Fairway lieber einen kürzeren, sicheren Schlag spielen.", "On a sloping fairway lie, play a shorter, safer shot."], ["c", "Notiere dir nach der Runde drei gute Schläge. So bleibt das Positive im Kopf.", "After your round write down three good shots. That keeps the positives in mind."], ["c", "Turnierrunde? Spiel dein normales Spiel. Kein Experiment am Turniertag.", "Tournament round? Play your normal game. No experiments on tournament day."], ["c", "Lerne das Grün vor dem Putten aus allen Richtungen kennen, während die anderen spielen.", "Study the green from all sides while the others are playing."], ["c", "Ein guter Score entsteht rund ums Grün. Dort lohnt sich die Konzentration am meisten.", "A good score is made around the green. That’s where focus pays off most."], ["c", "Plane für die nächste Runde: Wo sind die gefährlichen Löcher, wo kannst du angreifen?", "Plan your next round: which holes are dangerous, where can you attack?"], ["c", "Visualisiere jeden Schlag kurz, bevor du ansprichst.", "Visualise each shot briefly before you address the ball."], ["c", "Spiel nicht gegen die Mitspieler, sondern gegen den Platz.", "Don’t play against your partners, play against the course."], ["c", "Bleib geduldig. Eine Runde hat 18 Löcher, da gleicht sich viel aus.", "Stay patient. A round has 18 holes, a lot evens out."], ["c", "Gute Körpersprache hilft: aufrecht gehen, auch nach einem schlechten Loch.", "Good body language helps: walk tall, even after a bad hole."], ["c", "Mach dir einen einfachen Plan für jedes Par 3: Mitte des Grüns, zwei Putts.", "Have a simple plan for every par 3: middle of the green, two putts."], ["c", "Fokussier dich auf das, was du kontrollieren kannst: Routine, Ziel, Rhythmus.", "Focus on what you can control: routine, target, rhythm."], ["c", "Spiel eine Übungsrunde mit zwei Bällen und nimm jeweils den schlechteren. Das schult Druck.", "Play a practice round with two balls and always take the worse one. It trains you for pressure."], ["c", "Nach einer starken Serie nicht übermütig werden. Weiter mit demselben Plan.", "After a strong run don’t get carried away. Keep the same plan."], ["c", "Schau dir die Löcher deines Heimatplatzes an und überlege, wo du Schläge sparen kannst.", "Study the holes of your home course and think about where you can save shots."], ["c", "Deine Entscheidungen auf dem Platz waren heute sehr klug. Genau so spielt man Golf.", "Your decisions on the course today were very smart. That’s how golf is played."], ["c", "Schreib dir eine Spielstrategie für deinen Heimatplatz. Wir gehen sie gemeinsam durch.", "Write a game plan for your home course. We’ll go through it together."], ["c", "Bei Regen: Griffe trocken halten, einen Schläger mehr, kürzer greifen.", "In rain: keep your grips dry, take one more club, grip down."], ["c", "Genieß die Runde. Wer Spaß hat, spielt meistens auch besser.", "Enjoy the round. People who have fun usually play better too."], ["c", "Nach der Runde 10 Minuten das üben, was heute am schlechtesten lief.", "After your round spend 10 minutes practising what went worst today."], ["c", "Setz dir realistische Ziele für jede Runde, z. B. höchstens zwei Bälle verlieren.", "Set realistic goals for each round, e.g. lose no more than two balls."], ["c", "Deine mentale Stärke wächst. Man merkt, dass du ruhiger mit Fehlern umgehst.", "Your mental strength is growing. You handle mistakes much more calmly."], ["h", "Deine Hausaufgabe diese Woche: 3 mal 30 Minuten üben. Schau in deinen Trainingsplan.", "Your homework this week: practise 3 times for 30 minutes. Check your training plan."], ["h", "Ich habe dir neue Übungen in den Trainingsplan gelegt. Hak sie ab, wenn du sie gemacht hast.", "I’ve added new drills to your training plan. Tick them off when you’ve done them."], ["h", "Mach jeden Tag 5 Minuten Probeschwünge vor dem Spiegel. Achte auf den Griff und die Haltung.", "Do 5 minutes of practice swings in front of a mirror every day. Watch your grip and posture."], ["h", "Schreib dir bei deiner nächsten Runde Fairways, Grüns und Putts auf, dann schauen wir sie uns gemeinsam an.", "On your next round note fairways, greens and putts, then we’ll look at them together."], ["h", "Nimm beim nächsten Üben ein kurzes Video von deinem Schwung auf und bring es mit.", "Film a short video of your swing next time you practise and bring it along."], ["h", "Bis zur nächsten Stunde: nur Kurzspiel und Putten. Der lange Schwung hat Pause.", "Until the next lesson: only short game and putting. The full swing takes a break."], ["h", "Lass uns in 2 Wochen weitermachen, damit es sich festigt. Buch dir gern direkt einen Termin in der App.", "Let’s continue in 2 weeks so it sticks. Feel free to book your next lesson right in the app."], ["h", "Wärm dich vor jeder Runde 10 Minuten auf: ein paar Chips, ein paar Putts, dann erst der Driver.", "Warm up for 10 minutes before every round: a few chips, a few putts, and only then the driver."], ["h", "Viel Spaß auf der Runde am Wochenende! Schreib mir gern, wie es gelaufen ist.", "Have fun on your round this weekend! Let me know how it went."], ["h", "Hausaufgabe: 50 Putts aus 1 Meter. Erst wenn 10 hintereinander drin sind, bist du fertig.", "Homework: 50 putts from 1 metre. You’re done when you hole 10 in a row."], ["h", "Diese Woche 3 Range-Sessions mit je 30 Bällen. Qualität vor Menge.", "This week 3 range sessions of 30 balls each. Quality over quantity."], ["h", "Übe die Leiter-Übung mit dem Wedge zweimal diese Woche.", "Do the wedge ladder drill twice this week."], ["h", "Bring zur nächsten Stunde deinen Driver mit. Wir arbeiten an der Länge.", "Bring your driver to the next lesson. We’ll work on distance."], ["h", "Bring zur nächsten Stunde deine Wedges mit. Wir machen Kurzspiel.", "Bring your wedges to the next lesson. We’ll do short game."], ["h", "Spiel diese Woche mindestens 9 Löcher und notier Fairways, Grüns und Putts.", "Play at least 9 holes this week and note fairways, greens and putts."], ["h", "Trag deine Schlägerweiten in der App ein. Dann können wir deine Schlägerwahl optimieren.", "Enter your club distances in the app. Then we can optimise your club selection."], ["h", "Miss deine Schlägerkopfgeschwindigkeit mit dem Driver und trag sie in der App ein.", "Measure your driver club head speed and log it in the app."], ["h", "5 Minuten Dehnen vor jeder Übungseinheit: Schultern, Hüfte und Rücken.", "5 minutes of stretching before every practice: shoulders, hips and back."], ["h", "Mach jeden Abend 10 langsame Probeschwünge mit Pause oben. Das festigt die neue Position.", "Every evening make 10 slow practice swings pausing at the top. It cements the new position."], ["h", "Halte den neuen Griff zu Hause ein paar Minuten am Tag. Dann fühlt er sich bald normal an.", "Hold the new grip at home for a few minutes a day. I    <label class="field">${t('club')}<input id="fClub"></label>`:''}
   <label class="field">${t('email')}<input id="fEmail" type="email" autocomplete="email" required></label>
   <label class="field">${t('password')}<input id="fPass" type="password" autocomplete="${su?'new-password':'current-password'}" minlength="8" required></label>
   ${su?`<label class="check"><input type="checkbox" id="fConsent"><span>${t('consent')}</span></label>`:''}
   <p class="err" id="authErr"></p>
   <button class="btn" id="authBtn">${su?t('signup'):t('login')}</button>
  </form>`;

async function submitAuth(){
  const err=$('#authErr');err.textContent='';const btn=$('#authBtn');
  const email=$('#fEmail').value.trim(),password=$('#fPass').value;
  if(S.authMode==='signup'){
    const full_name=$('#fName').value.trim(),phone=$('#fPhone').value.trim(),home_club=$('#fClub').value.trim();
    if(!full_name||!phone||!email||password.length<8){err.textContent=L==='de'?'Bitte alle Pflichtfelder ausfüllen (Passwort mind. 8 Zeichen).':'Please fill in all required fields (password min. 8 characters).';return}
    if(!$('#fConsent').checked){err.textContent=t('needConsent');return}
    btn.disabled=true;
    const {data,error}=await sb.auth.signUp({email,password,options:{data:{full_name,phone,home_club,language:L,consent:'true'}}});
    btn.disabled=false;
    if(error){err.textContent=error.message.includes('registered')?(L==='de'?'Diese E-Mail ist schon registriert. Bitte melde dich an.':'This email is already registered. Please log in.'):t('genericErr');return}
    if(!data.session){S.authMode='login';renderAuth(`<div class="ok">${t('confirmMail')}</div>`);return}
  }else{
    btn.disabled=true;
    const {error}=await sb.auth.signInWithPassword({email,password});
    btn.disabled=false;
    if(error){err.textContent=t('badLogin');return}
  }
}
