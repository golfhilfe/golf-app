  const hrsList=[...Array(14)].map((_,i)=>String(i+7).padStart(2,'0')+':00');const order=[1,2,3,4,5,6,0];
  const draw=()=>order.map(w=>`<div style="margin-bottom:12px"><b class="sm">${t('days7')[w]}</b><div class="chips" style="flex-wrap:wrap;overflow:visible">${hrsList.map(h=>`<button data-wk="${w}|${h}" aria-pressed="${(D.oh||[]).some(o=>o.weekday===w&&o.start_time===h)}">${h}</button>`).join('')}</div></div>`).join('');
  const s=sheet(`<h2>${t('weekHours')}</h2><p class="sm mute">${t('weekHint')}</p><div id="wkGrid">${draw()}</div><button class="btn" data-close>${t('done')}</button>`);
  s.addEventListener('click',async e=>{const b=e.target.closest('[data-wk]');if(!b)return;const [w,h]=b.dataset.wk.split('|');const on=b.getAttribute('aria-pressed')==='true';b.disabled=true;
    try{if(on){await q(sb.from('open_hours').delete().eq('weekday',+w).eq('start_time',h));D.oh=D.oh.filter(o=>!(o.weekday===+w&&o.start_time===h))}
    else{await q(sb.from('open_hours').insert({academy_id:S.me.academy_id,weekday:+w,start_time:h}));D.oh.push({weekday:+w,start_time:h})}
    b.setAttribute('aria-pressed',String(!on))}catch(err){fail(err)}b.disabled=false});
  const obs=new MutationObserver(()=>{if(!s.isConnected){obs.disconnect();render(true)}});obs.observe($('#app'),{childList:true});
}
function profileSheet(){
  const m=S.me;
  const s=sheet(`<h2>${t('profile')}</h2><div class="sm mute" style="margin-bottom:12px">${S.coach?t('pro'):''}</div>
   <form id="profForm"><label class="field">${t('name')}<input id="pName" value="${esc(m.full_name)}"></label><label class="field">${t('phone')}<input id="pPhone" type="tel" value="${esc(m.phone)}"></label><label class="field">${t('club').replace(' (optional)','')}<input id="pClub" value="${esc(m.home_club)}"></label>
   ${S.coach?'':`<div class="row" style="gap:10px"><label class="field" style="flex:1">${t('hcp')}<input id="pHcp" type="number" step="0.1" value="${m.handicap??''}"></label><label class="field" style="flex:1">${t('goalHcp')}<input id="pGoal" type="number" step="0.1" value="${m.goal_handicap??''}"></label></div>`}
   <button class="btn">${t('save')}</button></form>
   <button class="btn ghost" id="logoutBtn" style="margin-top:8px">${t('logout')}</button><button class="btn ghost" data-close style="margin-top:8px">${t('close')}</button>`);
  s.querySelector('#profForm').onsubmit=async e=>{e.preventDefault();const v=id=>{const el=s.querySelector(id);return el?el.value.trim():undefined};const nn=x=>x===''||x==null?null:Number(String(x).replace(',','.'));
    const upd={full_name:v('#pName'),phone:v('#pPhone'),home_club:v('#pClub')};if(!S.coach){upd.handicap=nn(v('#pHcp'));upd.goal_handicap=nn(v('#pGoal'))}
    try{await q(sb.from('profiles').update(upd).eq('id',m.id));Object.assign(S.me,upd);s.remove();toast(t('saved'));render(true)}catch(err){fail(err)}};
  s.querySelector('#logoutBtn').onclick=async()=>{await sb.auth.signOut();s.remove()};
}

/* ---------- events ---------- */
$('#lang').addEventListener('click',async e=>{const b=e.target.closest('[data-lang]');if(!b)return;L=b.dataset.lang;try{localStorage.setItem('ga-lang',L)}catch(err){}
  if(S.me){sb.from('profiles').update({language:L}).eq('id',S.me.id).then(()=>{});render(true)}else renderAuth()});
$('#avBtn').onclick=profileSheet;
auth.addEventListener('click',e=>{const b=e.target.closest('[data-am]');if(b){S.authMode=b.dataset.am;renderAuth()}});
auth.addEventListener('submit',e=>{e.preventDefault();submitAuth().catch(fail)});
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b)go(b.dataset.tab)});
async function loadTaken(){const days=new Date();days.setHours(0,0,0,0);D.taken=await q(sb.rpc('taken_slots',{from_ts:days.toISOString(),to_ts:new Date(days.getTime()+11*864e5).toISOString()}))}
view.addEventListener('click',async e=>{
  const b=e.target.closest('button,[data-go],[data-client]');if(!b)return;const d=b.dataset;
  try{
  if(d.go){if(d.go==='book')await loadTaken();go(d.go)}
  else if(d.bt){S.bookType=d.bt;S.slot=null;if(d.bt==='private')await loadTaken();render(true)}
  else if(d.lt){S.lt=d.lt;S.slot=null;render(true)}
  else if(d.day){S.day=+d.day;S.slot=null;render(true)}
  else if(d.slot){S.slot=d.slot;render(true)}
  else if(b.id==='bookBtn'&&S.slot){b.disabled=true;const lt=D.lt.find(x=>x.id===S.lt);
    const {error}=await sb.from('bookings').insert({academy_id:S.me.academy_id,client_id:S.me.id,lesson_type_id:lt.id,starts_at:S.slot});
    if(error){toast(error.code==='23505'?t('slotGone'):t('genericErr'));await loadTaken();S.slot=null;render(true);return}
    const st=new Date(S.slot);S.slot=null;toast(t('booked')(dlabel(st),tm(st)));await refresh();await loadTaken();render(true)}
  else if(d.cancel){b.disabled=true;await q(sb.from('bookings').update({status:'cancelled'}).eq('id',d.cancel));toast(t('cancelled'));await refresh();await loadTaken();render(true)}
  else if(d.join){b.disabled=true;if(d.mine==='1'){await q(sb.from('group_signups').delete().eq('session_id',d.join).eq('client_id',S.me.id));toast(t('leftG'))}else{const wl=await q(sb.rpc('join_group',{p_session:d.join}));toast(wl?t('waitAdded'):t('joined'))}await refresh();render(true)}
  else if(d.ptab){S.ptab=d.ptab;render(true)}
  else if(d.addself){b.disabled=true;await q(sb.from('assigned_drills').insert({client_id:S.me.id,drill_id:d.addself,self_added:true}));toast(L==='de'?'Zu deinem Plan hinzugefügt':'Added to your plan');await loadClient();render(true)}
  else if(d.badge){sheet(BADGES.detail(BST||myStats(),d.badge)+`<button class="btn ghost" data-close style="margin-top:12px">${t('close')}</button>`)}
  else if(d.drill){const a=D.ad.find(x=>x.id===d.drill);const v=a.done_at?null:new Date().toISOString();await q(sb.from('assigned_drills').update({done_at:v}).eq('id',a.id));a.done_at=v;render(true);checkBadges()}
  else if(d.log){b.disabled=true;await q(sb.from('practice_logs').insert({client_id:S.me.id,hours:+d.log}));toast(t('logged')(hrs(+d.log)));await loadClient();render(true)}
  else if(d.trip){tripSheet(d.trip)}
  else if(d.client){clientSheet(d.client).catch(fail)}
  else if(d.note){noteSheet(d.note)}
  else if(d.snooze){snoozeClient(d.snooze)}
  else if(d.approve){decidePending(d.approve,true)}
  else if(d.decline){decidePending(d.decline,false)}
  else if(d.cday){S.cday=+d.cday;render(true)}
  else if(d.block){b.disabled=true;const st=new Date(d.block);await q(sb.from('blocks').insert({academy_id:S.me.academy_id,starts_at:st.toISOString(),ends_at:new Date(st.getTime()+36e5).toISOString()}));toast(t('slotBlocked'));await loadCoach();render(true)}
  else if(d.unblock){b.disabled=true;await q(sb.from('blocks').delete().eq('id',d.unblock));toast(t('slotFreed'));await loadCoach();render(true)}
  else if(d.dayblock){b.disabled=true;const day=new Date();day.setHours(0,0,0,0);day.setDate(day.getDate()+(S.cday||0));const end=new Date(day.getTime()+864e5);
    if(d.dayblock==='on'){await q(sb.from('blocks').insert({academy_id:S.me.academy_id,starts_at:day.toISOString(),ends_at:end.toISOString(),note:'day'}));toast(t('dayBlocked'))}
    else{await q(sb.from('blocks').delete().lt('starts_at',end.toISOString()).gt('ends_at',day.toISOString()));toast(t('dayFreed'))}
    await loadCoach();render(true)}
  else if(b.id==='weekBtn'){weekSheet()}
  else if(d.ccancel){if(b.dataset.armed!=='1'){b.dataset.armed='1';b.textContent=t('cancelConfirm');return}b.disabled=true;await q(sb.from('bookings').update({status:'cancelled'}).eq('id',d.ccancel));toast(t('bkCancelled'));await loadCoach();render(true)}
  else if(d.delgroup){if(b.dataset.armed!=='1'){b.dataset.armed='1';b.textContent=t('cancelConfirm');return}b.disabled=true;await q(sb.from('group_sessions').delete().eq('id',d.delgroup));toast(t('groupDeleted'));await loadCoach();render(true)}
  else if(d.cat){S.lib.cat=d.cat;view.querySelectorAll('[data-cat]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.cat===d.cat));renderLib()}
  else if(d.pick){const j=S.lib.sel.indexOf(d.pick);if(j<0)S.lib.sel.push(d.pick);else S.lib.sel.splice(j,1);renderLib()}
  else if(b.id==='assignBtn'){const c=D.clients.find(x=>x.id===S.lib.client);const n=S.lib.sel.length;b.disabled=true;
    await q(sb.from('assigned_drills').upsert(S.lib.sel.map(id=>({client_id:c.id,drill_id:id})),{onConflict:'client_id,drill_id',ignoreDuplicates:true}));
    S.lib.sel=[];toast(t('assignedN')(n,c.full_name));await loadCoach();renderLib()}
  }catch(err){fail(err);render(true)}
});
view.addEventListener('input',e=>{if(e.target.id==='libQ'){S.lib.q=e.target.value;if(S.lib.q){S.lib.cat='all';view.querySelectorAll('[data-cat]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.cat==='all'))}renderLib()}});
view.addEventListener('change',e=>{if(e.target.id==='aClient'){S.lib.client=e.target.value;renderLib()}});
view.addEventListener('submit',async e=>{e.preventDefault();const fm=e.target;const btn=fm.querySelector('button');btn.disabled=true;
  try{
  if(fm.id==='roundForm'){const v=id=>$(id).value;const nn=x=>x===''?null:Number(String(x).replace(',','.'));const hc=nn(v('#rHcp'));
    await q(sb.from('rounds').insert({client_id:S.me.id,score:nn(v('#rScore')),putts:nn(v('#rPutts')),fairways:nn(v('#rFw')),greens:nn(v('#rGir')),handicap_after:hc}));
    if(hc!=null){await q(sb.from('profiles').update({handicap:hc}).eq('id',S.me.id));S.me.handicap=hc}
    toast(t('roundSaved'));await loadClient();render(true)}
  if(fm.id==='coachBook'){const v=id=>$(id).value;const st=new Date(v('#cbDate')+'T'+v('#cbTime'));const c=D.clients.find(x=>x.id===v('#cbClient'));
    const {error}=await sb.from('bookings').insert({academy_id:S.me.academy_id,client_id:c.id,lesson_type_id:v('#cbLt'),starts_at:st.toISOString()});
    if(error){btn.disabled=false;toast(error.code==='23505'?t('slotGone'):t('genericErr'));return}
    toast(t('bookedFor')(c.full_name));await loadCoach();render(true)}
  if(fm.id==='groupForm'){const v=id=>$(id).value.trim();const st=new Date(v('#gDate')+'T'+v('#gTime'));
    await q(sb.from('group_sessions').insert({academy_id:S.me.academy_id,title_de:v('#gTitle'),title_en:v('#gTitleEn')||v('#gTitle'),starts_at:st.toISOString(),minutes:+v('#gMin'),capacity:+v('#gCap'),price_cents:Math.round(+v('#gPrice')*100)}));
    toast(t('created'));await loadCoach();render(true)}
  }catch(err){btn.disabled=false;fail(err)}});

/* ---------- boot ---------- */
async function boot(){
  try{await loadMe()}catch(e){S.me=null}
  if(!S.me){chrome();renderAuth();return}
  if(!S.coach&&(S.me.approved===false||S.me.declined)){renderPending();return}
  S.tab='home';await go('home');checkBadges();
}
sb.auth.onAuthStateChange((ev)=>{if(ev==='SIGNED_IN'||ev==='SIGNED_OUT')setTimeout(boot,0)});
chrome();boot();
}
</script>

<script>if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{})</script>
